name: Release

# vX.Y.Z on a green main commit -> verified release -> composition and deploy.
# Shared with ghfind-server and ghfind-frontend: see component-release.yml.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/component-release.yml
    with:
      ci-workflow: ci.yml
