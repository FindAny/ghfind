name: Deploy production (Cloudflare)

# User-approved direct production path: exact local dual-profile E2E and push CI
# remain mandatory. Isolated staging remains available as a separate workflow.
# A paused Go-only Web is the first-release containment anchor, not a claim of
# restored Feed availability. Never roll back to a legacy D1 writer after Go.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [deploy]
permissions:
  contents: read
  actions: read
concurrency:
  group: deploy-cf-production-main
  cancel-in-progress: false
jobs:
  authorize:
    outputs:
      current: ${{ steps.authorization.outputs.current }}
    name: Require exact deploy-branch CI and complete dual-profile E2E
    if: ${{ github.repository == 'FindAny/ghfind' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'deploy' && github.event.workflow_run.repository.full_name == 'FindAny/ghfind' }}
    runs-on: ubuntu-latest
    # The release bot key is only available in protected environments (main/deploy).
    environment: release
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Assemble workspace (ghfind-server + ghfind-frontend)
        uses: ./.github/actions/assemble
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          require-manifest: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify actual checkout, CI receipts and existing release protections
        id: authorization
        env:
          ALLOW_SUPERSEDED_SKIP: "1"
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/deploy" --jq .object.sha)" != "$RELEASE_SHA" ]; then
            echo "::notice::superseded"
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/feed-ci-evidence.mjs verify-ci-remote "$RELEASE_SHA" "$RUNNER_TEMP/feed-ci-evidence.json"
          if [ "$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1])).status || ''" "$RUNNER_TEMP/feed-ci-evidence.json")" = superseded ]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"
          node scripts/feed-github-protection.mjs --verify-existing "$RUNNER_TEMP/feed-github-protection.json"
      - uses: actions/upload-artifact@v4
        if: steps.authorization.outputs.current == 'true'
        with:
          name: feed-production-authorization-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/feed-ci-evidence.json
            ${{ runner.temp }}/feed-github-protection.json
          if-no-files-found: error
  plan:
    name: Plan the Feed release
    needs: [authorize]
    if: needs.authorize.outputs.current == 'true'
    runs-on: ubuntu-latest
    # The release bot key is only available in protected environments (main/deploy).
    environment: release
    timeout-minutes: 5
    outputs:
      feed_release: ${{ steps.plan.outputs.feed_release }}
      feed_input_hash: ${{ steps.plan.outputs.feed_input_hash }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Assemble workspace (ghfind-server + ghfind-frontend)
        uses: ./.github/actions/assemble
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          require-manifest: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare Feed inputs with the last successful cutover
        id: plan
        env:
          # Owner override: set the repository variable FEED_RELEASE_MODE=always to force a cutover.
          FEED_RELEASE_MODE: ${{ vars.FEED_RELEASE_MODE || 'auto' }}
        run: |
          set -euo pipefail
          hash="$(node scripts/feed-release-plan.mjs hash | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).hash')"
          released=""
          if git fetch -q --no-tags origin "+refs/tags/feed/released:refs/tags/feed/released" 2>/dev/null; then
            released="$(git for-each-ref refs/tags/feed/released --format='%(contents)' | sed -n 's/^feed-input-hash: \([a-f0-9]\{64\}\)$/\1/p' | head -1)"
          fi
          decision="$(node scripts/feed-release-plan.mjs decide "$hash" "${released:--}" "$FEED_RELEASE_MODE")"
          echo "$decision"
          echo "feed_input_hash=$hash" >> "$GITHUB_OUTPUT"
          echo "feed_release=$(node -pe 'JSON.parse(process.argv[1]).feedRelease' "$decision")" >> "$GITHUB_OUTPUT"
          { echo "### Feed release plan"; echo; echo "- Feed inputs: \`${hash:0:16}\`"; echo "- last successful cutover: \`${released:0:16}\`"; echo "- decision: \`$decision\`"; } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy verified Go Feed and cut over the production gateway
    needs: [authorize, plan]
    # Only when the Feed inputs changed (or FEED_RELEASE_MODE=always); otherwise the
    # site job releases the Web in the live gateway mode without touching the runtime.
    if: needs.authorize.outputs.current == 'true' && needs.plan.outputs.feed_release == 'true'
    environment: Production
    # Production and apps releases both apply core D1 migrations; never concurrently.
    concurrency:
      group: production-d1-writers
      cancel-in-progress: false
    permissions:
      contents: write   # record the feed/released tag after a successful cutover
      actions: read
    outputs:
      # The Web (legacy SCORE backend) is live at this release once a paused Web was
      # deployed and verified, even if the Feed cutover fails afterwards.
      web_released: ${{ steps.pause-web.outputs.released == 'true' || steps.paused.outputs.version != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
      NEXT_TELEMETRY_DISABLED: "1"
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      FEED_ASSESSMENT_CARRYOVER: ops/feed-production-assessment-carryover.json
      EXPECTED_ACCOUNT_ID: 8f19bebe359e4ec1a24c68c5f49c1584
      CLOUDFLARE_ACCOUNT_ID: 8f19bebe359e4ec1a24c68c5f49c1584
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      FEED_GATEWAY_SECRET: ${{ secrets.FEED_GATEWAY_SECRET }}
      FEED_SIGNING_SECRET: ${{ secrets.FEED_SIGNING_SECRET }}
      FEED_BRIDGE_SECRET: ${{ secrets.FEED_BRIDGE_SECRET }}
      FEED_RUNTIME_ADMIN_SECRET: ${{ secrets.FEED_RUNTIME_ADMIN_SECRET }}
      FEED_EXECUTOR_SECRET: ${{ secrets.FEED_EXECUTOR_SECRET }}
      FEED_DELIVERY_SECRET: ${{ secrets.FEED_DELIVERY_SECRET }}
      FEED_SOURCE_SECRET: ${{ secrets.FEED_SOURCE_SECRET }}
      FEED_OPERATOR_SECRET: ${{ secrets.FEED_OPERATOR_SECRET }}
      MOSOO_API_TOKEN: ${{ secrets.MOSOO_API_TOKEN }}
      PROJECT_ANALYSIS_RECONCILE_SECRET: ${{ secrets.PROJECT_ANALYSIS_RECONCILE_SECRET }}
      MOSOO_API_BASE: ${{ vars.MOSOO_API_BASE }}
      MOSOO_PROJECT_AGENT_ID: ${{ vars.MOSOO_PROJECT_AGENT_ID }}
      MOSOO_PROJECT_USER_ID: ${{ vars.MOSOO_PROJECT_USER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Assemble workspace (ghfind-server + ghfind-frontend)
        uses: ./.github/actions/assemble
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          require-manifest: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reject a superseded release before any mutation
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/deploy" --jq .object.sha)" != "$RELEASE_SHA" ]; then
            echo "::notice::superseded"
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"
          test "$CLOUDFLARE_ACCOUNT_ID" = "$EXPECTED_ACCOUNT_ID"
      - name: Install locked dependencies
        if: steps.current.outputs.current == 'true'
        run: |
          pnpm install --frozen-lockfile
          npm ci --prefix platform/runtime
          pnpm -C platform/feed install --frozen-lockfile
      - name: Validate pinned production manifest and role credentials
        if: steps.current.outputs.current == 'true'
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/feed-production-evidence"
          node scripts/feed-platform-production.mjs validate ops/feed-production-manifest.json
          node scripts/feed-production-release.mjs prepare "$RUNNER_TEMP"
          node scripts/feed-production-release.mjs web "$RELEASE_SHA" paused
      # The paid assessment is complete. Keep its reviewed journal in git and
      # validate authoritative D1 state, not expiring Actions artifacts. This
      # path has no provider start/retry capability and never resets its budgets.
      - name: Verify completed assessment source before deployment
        if: steps.current.outputs.current == 'true'
        run: |
          node scripts/feed-production-assessment-checkpoint.mjs "$RELEASE_SHA" ops/feed-production-assessment-checkpoint.json ops/feed-production-assessment-carryover.json "$RUNNER_TEMP/feed-production-evidence/assessment-source.json" --source-only
      - name: Build the real Web without runtime secrets or local dotenv files
        if: steps.current.outputs.current == 'true'
        timeout-minutes: 15
        run: node scripts/feed-production-release.mjs build
      - name: Build and push the portable image before touching active services
        if: steps.current.outputs.current == 'true'
        id: image
        run: |
          set -euo pipefail
          export FEED_IMAGE_BUILD_ID="$(openssl rand -hex 32)"
          echo "FEED_IMAGE_BUILD_ID=$FEED_IMAGE_BUILD_ID" >> "$GITHUB_ENV"
          docker build --platform linux/amd64 --build-arg VERSION="$RELEASE_SHA" --build-arg IMAGE_BUILD_ID="$FEED_IMAGE_BUILD_ID" -f Dockerfile.feed -t "ghfind-feed:$RELEASE_SHA" .
          # Inspect the compiled entrypoints themselves, without starting services.
          docker run --rm --network none --entrypoint /usr/local/bin/feed-api "ghfind-feed:$RELEASE_SHA" --build-info > "$RUNNER_TEMP/feed-production-evidence/image-api.json"
          docker run --rm --network none --entrypoint /usr/local/bin/feed-worker "ghfind-feed:$RELEASE_SHA" --build-info > "$RUNNER_TEMP/feed-production-evidence/image-worker.json"
          platform/runtime/node_modules/.bin/wrangler containers push "ghfind-feed:$RELEASE_SHA" --config platform/runtime/wrangler.jsonc
          image_ref="$(docker image inspect "registry.cloudflare.com/$CLOUDFLARE_ACCOUNT_ID/ghfind-feed:$RELEASE_SHA" --format '{{json .RepoDigests}}' | jq -er --arg prefix "registry.cloudflare.com/$CLOUDFLARE_ACCOUNT_ID/ghfind-feed@sha256:" '[.[] | select(startswith($prefix))] | if length == 1 then .[0] else error("unambiguous pushed digest required") end')"
          node scripts/feed-image-proof.mjs "$image_ref" "$RUNNER_TEMP/feed-production-evidence"
          echo "reference=$image_ref" >> "$GITHUB_OUTPUT"
      - name: Ensure the pinned resources and record their actual identities
        if: steps.current.outputs.current == 'true'
        id: resources
        run: |
          set -euo pipefail
          node scripts/feed-production-release.mjs resources ops/feed-production-manifest.json "$RUNNER_TEMP/feed-production-evidence/resources.json"
          echo "backend=$(jq -er .existingBackend "$RUNNER_TEMP/feed-production-evidence/resources.json")" >> "$GITHUB_OUTPUT"
      - name: Apply and verify explicitly approved production D1 migrations
        if: steps.current.outputs.current == 'true'
        run: |
          set -euo pipefail
          release_config="$(node scripts/feed-production-release.mjs schema "$RUNNER_TEMP/approved-feed-production-schema")"
          platform/runtime/node_modules/.bin/wrangler d1 migrations apply ghfind --remote --config "$release_config"
          platform/runtime/node_modules/.bin/wrangler d1 migrations apply ghfind-feed --remote --config "$release_config"
          platform/runtime/node_modules/.bin/wrangler d1 execute ghfind-feed --remote --config "$release_config" --json --command "SELECT * FROM feed_runtime_control; SELECT * FROM feed_schema_compatibility; SELECT name FROM d1_migrations ORDER BY id;" > "$RUNNER_TEMP/feed-production-evidence/schema.json"
      - name: Populate new build cache before replacing the public Web
        if: steps.current.outputs.current == 'true'
        run: node node_modules/@opennextjs/cloudflare/dist/cli/index.js populateCache remote --config platform/runtime/wrangler.web.production.generated.json --cacheChunkSize 10
      - name: Pause an already active Go gateway before replacing its runtime
        id: pause-web
        if: steps.current.outputs.current == 'true' && (steps.resources.outputs.backend == 'go')
        run: |
          set -euo pipefail
          platform/runtime/node_modules/.bin/wrangler deploy --config platform/runtime/wrangler.web.production.generated.json --keep-vars --secrets-file "$RUNNER_TEMP/feed-web-secrets.json" --tag "production-$RELEASE_SHA" --message "Pause Go writes for compatible runtime update" 2>&1 | tee "$RUNNER_TEMP/feed-production-evidence/web-update-paused-deploy.log"
          version_id="$(node scripts/feed-production-release.mjs web-version-id "$RUNNER_TEMP/feed-production-evidence/web-update-paused-deploy.log")"
          node scripts/feed-production-release.mjs web-verify "$RELEASE_SHA" paused "$RUNNER_TEMP/feed-production-evidence/web-update-paused.json" ${version_id:+"$version_id"}
          echo "released=true" >> "$GITHUB_OUTPUT"
          sleep 35
      - name: Detach only the owned consumers before installing off-mode runtime
        if: steps.current.outputs.current == 'true'
        run: |
          node scripts/feed-platform-production.mjs disable-consumers ops/feed-production-manifest.json "$RUNNER_TEMP/feed-production-evidence/consumer-pause.json"
      - name: Deploy private adapter and off-mode candidate by immutable digest
        if: steps.current.outputs.current == 'true'
        run: |
          set -euo pipefail
          node scripts/feed-platform-production.mjs render ops/feed-production-manifest.json "$RELEASE_SHA" "${{ steps.image.outputs.reference }}" off
          node scripts/feed-platform-production.mjs snapshot ops/feed-production-manifest.json "$RUNNER_TEMP/feed-production-evidence/applications-before-off.json"
          platform/runtime/node_modules/.bin/wrangler deploy --config platform/runtime/wrangler.adapter.production.generated.json --secrets-file "$RUNNER_TEMP/feed-adapter-secrets.json" --tag "production-$RELEASE_SHA"
          runtime_attempt=1
          while true; do
            runtime_log="$RUNNER_TEMP/feed-production-evidence/runtime-off-deploy-${runtime_attempt}.log"
            if platform/runtime/node_modules/.bin/wrangler deploy --config platform/runtime/wrangler.production.generated.json --containers-rollout=immediate --secrets-file "$RUNNER_TEMP/feed-runtime-secrets.json" --tag "production-$RELEASE_SHA" >"$runtime_log" 2>&1; then
              cat "$runtime_log"
              break
            fi
            cat "$runtime_log"
            if ! grep -Eq '\[code:[[:space:]]*100146\]' "$runtime_log"; then exit 1; fi
            if [ "$runtime_attempt" -ge 6 ]; then exit 1; fi
            runtime_attempt=$((runtime_attempt + 1))
            sleep 10
          done
          timeout --signal=TERM --kill-after=5s 610s node scripts/feed-production-rollout.mjs ops/feed-production-manifest.json "${{ steps.image.outputs.reference }}" "$RUNNER_TEMP/feed-production-evidence/applications-before-off.json" "$RUNNER_TEMP/feed-production-evidence/off-rollout.json"
          # DO code replacement does not replace an already-running process.
          # Only after pause + consumer detachment, replace each fixed actor and
          # prove its new off identity before the normal full readiness gate.
          timeout --signal=TERM --kill-after=5s 240s node scripts/feed-production-off-transition.mjs ops/feed-production-manifest.json "${{ steps.image.outputs.reference }}" "$RUNNER_TEMP/feed-production-evidence/consumer-pause.json" "$RUNNER_TEMP/feed-production-evidence/off-transition.json"
          node scripts/feed-platform-production.mjs verify ops/feed-production-manifest.json "$RELEASE_SHA" "${{ steps.image.outputs.reference }}" off "$RUNNER_TEMP/feed-production-evidence/runtime-off.json" "$RUNNER_TEMP/feed-production-evidence/applications-before-off.json"
      - name: Install a compatible paused gateway before any new Go writer
        if: steps.current.outputs.current == 'true'
        id: paused
        run: |
          set -euo pipefail
          platform/runtime/node_modules/.bin/wrangler deploy --config platform/runtime/wrangler.web.production.generated.json --keep-vars --secrets-file "$RUNNER_TEMP/feed-web-secrets.json" --tag "production-$RELEASE_SHA" --message "Go-only paused containment anchor $RELEASE_SHA" 2>&1 | tee "$RUNNER_TEMP/feed-production-evidence/web-paused-deploy.log"
          version_id="$(node scripts/feed-production-release.mjs web-version-id "$RUNNER_TEMP/feed-production-evidence/web-paused-deploy.log")"
          node scripts/feed-production-release.mjs web-verify "$RELEASE_SHA" paused "$RUNNER_TEMP/feed-production-evidence/web-paused.json" ${version_id:+"$version_id"}
          echo "version=$(jq -er .workerVersionId "$RUNNER_TEMP/feed-production-evidence/web-paused.json")" >> "$GITHUB_OUTPUT"
          # HTTP requests have no wall-clock hard limit. A delay cannot prove
          # old requests drained: reject their SQL in the database instead.
          platform/runtime/node_modules/.bin/wrangler d1 execute ghfind-feed --remote --config "$RUNNER_TEMP/approved-feed-production-schema/wrangler.json" --command "UPDATE feed_adapter_write_fence SET enabled=1 WHERE id=1;" --json > "$RUNNER_TEMP/feed-production-evidence/writer-fence-activation.json"
          platform/runtime/node_modules/.bin/wrangler d1 execute ghfind-feed --remote --config "$RUNNER_TEMP/approved-feed-production-schema/wrangler.json" --command "SELECT enabled FROM feed_adapter_write_fence WHERE id=1; SELECT COUNT(*) AS leaked_contexts FROM feed_adapter_write_context; SELECT COUNT(*) AS legacy_triggers FROM sqlite_master WHERE type='trigger' AND (name LIKE 'feed_%_adapter_insert' OR name LIKE 'feed_%_adapter_update' OR name LIKE 'feed_%_adapter_delete');" --json > "$RUNNER_TEMP/feed-production-evidence/writer-fence.json"
          jq -e '.[0].results[0].enabled == 1 and .[1].results[0].leaked_contexts == 0 and .[2].results[0].legacy_triggers == 39' "$RUNNER_TEMP/feed-production-evidence/writer-fence.json" >/dev/null
      - name: Activate executor and verify actual baseline instances before gateway traffic
        if: steps.current.outputs.current == 'true'
        run: |
          set -euo pipefail
          node scripts/feed-platform-production.mjs render ops/feed-production-manifest.json "$RELEASE_SHA" "${{ steps.image.outputs.reference }}" baseline "$RUNNER_TEMP/feed-production-evidence/runtime-off.json"
          node scripts/feed-platform-production.mjs snapshot ops/feed-production-manifest.json "$RUNNER_TEMP/feed-production-evidence/applications-before-baseline.json"
          runtime_attempt=1
          while true; do
            runtime_log="$RUNNER_TEMP/feed-production-evidence/runtime-baseline-deploy-${runtime_attempt}.log"
            if platform/runtime/node_modules/.bin/wrangler deploy --config platform/runtime/wrangler.production.generated.json --containers-rollout=immediate --secrets-file "$RUNNER_TEMP/feed-runtime-secrets.json" --tag "production-$RELEASE_SHA" >"$runtime_log" 2>&1; then
              cat "$runtime_log"
              break
            fi
            cat "$runtime_log"
            if ! grep -Eq '\[code:[[:space:]]*100146\]' "$runtime_log"; then exit 1; fi
            if [ "$runtime_attempt" -ge 6 ]; then exit 1; fi
            runtime_attempt=$((runtime_attempt + 1))
            sleep 10
          done
          # Explicitly stop and restart each fixed actor with baseline env.
          # The SDK does not replace envVars in an already running process.
          timeout --signal=TERM --kill-after=5s 420s node scripts/feed-production-transition.mjs ops/feed-production-manifest.json "$RUNNER_TEMP/feed-production-evidence/runtime-off.json" "$RUNNER_TEMP/feed-production-evidence/mode-transition.json"
          node scripts/feed-platform-production.mjs verify ops/feed-production-manifest.json "$RELEASE_SHA" "${{ steps.image.outputs.reference }}" baseline "$RUNNER_TEMP/feed-production-evidence/runtime-baseline.json" "$RUNNER_TEMP/feed-production-evidence/applications-before-baseline.json"
      - name: Verify completed assessment and current durable projection
        if: steps.current.outputs.current == 'true'
        run: |
          node scripts/feed-production-assessment-checkpoint.mjs "$RELEASE_SHA" ops/feed-production-assessment-checkpoint.json ops/feed-production-assessment-carryover.json "$RUNNER_TEMP/feed-production-evidence/assessment-result.json"
      - name: Verify bounded authenticated Go service contracts before opening the gateway
        if: steps.current.outputs.current == 'true'
        run: |
          node scripts/feed-production-smoke.mjs --mode all --runtime-mode baseline --release-sha "$RELEASE_SHA" --image "${{ steps.image.outputs.reference }}" --writer-epoch 1 --profile cf_d1_r2 --output "$RUNNER_TEMP/feed-production-evidence/service-smoke.json" --execute
      - name: Record gateway admission intent before starting the cutover
        if: steps.current.outputs.current == 'true'
        id: admission
        run: |
          echo "started=true" >> "$GITHUB_OUTPUT"
      - name: Cut all Feed requests to the verified Go runtime
        if: steps.current.outputs.current == 'true'
        id: cutover
        run: |
          set -euo pipefail
          node scripts/feed-production-release.mjs web "$RELEASE_SHA" all
          platform/runtime/node_modules/.bin/wrangler deploy --config platform/runtime/wrangler.web.production.generated.json --keep-vars --secrets-file "$RUNNER_TEMP/feed-web-secrets.json" --tag "production-$RELEASE_SHA" --message "Go Feed all; unchanged D1; $RELEASE_SHA" 2>&1 | tee "$RUNNER_TEMP/feed-production-evidence/web-all-deploy.log"
          version_id="$(node scripts/feed-production-release.mjs web-version-id "$RUNNER_TEMP/feed-production-evidence/web-all-deploy.log")"
          node scripts/feed-production-release.mjs web-verify "$RELEASE_SHA" all "$RUNNER_TEMP/feed-production-evidence/web-all.json" ${version_id:+"$version_id"}
          node node_modules/@opennextjs/cloudflare/dist/cli/index.js populateCache remote --config platform/runtime/wrangler.web.production.generated.json --cacheChunkSize 10
      - name: Bounded public production smoke
        if: steps.current.outputs.current == 'true'
        id: smoke
        env:
          SMOKE_BASE_URL: https://ghfind.beiming1201.workers.dev
          SMOKE_EXPECTED_ORIGIN: https://ghfind.com
          SMOKE_CANARY_HANDLE: octocat
          SMOKE_FACET_TYPE: language
          SMOKE_FACET_VALUE: TypeScript
        run: pnpm smoke:deployment
      - name: Record the released Feed inputs (feed/released)
        if: steps.current.outputs.current == 'true' && steps.smoke.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          FEED_INPUT_HASH: ${{ needs.plan.outputs.feed_input_hash }}
        run: |
          set -euo pipefail
          test -n "$FEED_INPUT_HASH"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            tag -f -a feed/released -m "feed-input-hash: $FEED_INPUT_HASH" -m "release: $RELEASE_SHA" "$RELEASE_SHA"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" refs/tags/feed/released
      - name: Contain failed cutover using the verified Go-only paused anchor
        if: steps.current.outputs.current == 'true' && (always() && steps.paused.outputs.version != '' && steps.admission.outputs.started == 'true' && steps.smoke.outcome != 'success')
        timeout-minutes: 6
        env:
          PAUSED_ANCHOR: ${{ steps.paused.outputs.version }}
        run: |
          set -euo pipefail
          node -e 'require("node:fs").writeFileSync(process.env.RUNNER_TEMP+"/feed-production-evidence/containment-attempt.json",JSON.stringify({status:"attempted_unverified",sourceSha:process.env.RELEASE_SHA,pausedAnchor:process.env.PAUSED_ANCHOR,observedAt:new Date().toISOString()}),{mode:0o600,flag:"wx"})'
          timeout --signal=TERM --kill-after=5s 120s platform/runtime/node_modules/.bin/wrangler rollback "$PAUSED_ANCHOR" --name ghfind --message "Contain failed Go cutover; preserve writer2 data" --yes
          timeout --signal=TERM --kill-after=5s 90s node scripts/feed-production-release.mjs web-verify "$RELEASE_SHA" paused "$RUNNER_TEMP/feed-production-evidence/containment.json"
      - name: Preserve nonsecret actual evidence, including failures
        if: steps.current.outputs.current == 'true' && (always())
        uses: actions/upload-artifact@v4
        with:
          name: feed-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/feed-production-evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: Remove temporary plaintext role credentials
        if: steps.current.outputs.current == 'true' && (always())
        run: rm -f "$RUNNER_TEMP/feed-web-secrets.json" "$RUNNER_TEMP/feed-runtime-secrets.json" "$RUNNER_TEMP/feed-adapter-secrets.json"


  site:
    name: Deploy the site in the live Feed gateway mode (Feed runtime untouched)
    needs: [authorize, plan]
    if: needs.authorize.outputs.current == 'true' && needs.plan.outputs.feed_release == 'false'
    environment: Production
    concurrency:
      group: production-d1-writers
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
      NEXT_TELEMETRY_DISABLED: "1"
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      FEED_ASSESSMENT_CARRYOVER: ops/feed-production-assessment-carryover.json
      EXPECTED_ACCOUNT_ID: 8f19bebe359e4ec1a24c68c5f49c1584
      CLOUDFLARE_ACCOUNT_ID: 8f19bebe359e4ec1a24c68c5f49c1584
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      FEED_GATEWAY_SECRET: ${{ secrets.FEED_GATEWAY_SECRET }}
      FEED_SIGNING_SECRET: ${{ secrets.FEED_SIGNING_SECRET }}
      FEED_BRIDGE_SECRET: ${{ secrets.FEED_BRIDGE_SECRET }}
      FEED_RUNTIME_ADMIN_SECRET: ${{ secrets.FEED_RUNTIME_ADMIN_SECRET }}
      FEED_EXECUTOR_SECRET: ${{ secrets.FEED_EXECUTOR_SECRET }}
      FEED_DELIVERY_SECRET: ${{ secrets.FEED_DELIVERY_SECRET }}
      FEED_SOURCE_SECRET: ${{ secrets.FEED_SOURCE_SECRET }}
      FEED_OPERATOR_SECRET: ${{ secrets.FEED_OPERATOR_SECRET }}
      MOSOO_API_TOKEN: ${{ secrets.MOSOO_API_TOKEN }}
      PROJECT_ANALYSIS_RECONCILE_SECRET: ${{ secrets.PROJECT_ANALYSIS_RECONCILE_SECRET }}
      MOSOO_API_BASE: ${{ vars.MOSOO_API_BASE }}
      MOSOO_PROJECT_AGENT_ID: ${{ vars.MOSOO_PROJECT_AGENT_ID }}
      MOSOO_PROJECT_USER_ID: ${{ vars.MOSOO_PROJECT_USER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Assemble workspace (ghfind-server + ghfind-frontend)
        uses: ./.github/actions/assemble
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          require-manifest: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reject a superseded release before any mutation
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/deploy" --jq .object.sha)" != "$RELEASE_SHA" ]; then
            echo "::notice::superseded"
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"
          test "$CLOUDFLARE_ACCOUNT_ID" = "$EXPECTED_ACCOUNT_ID"
      - name: Install locked dependencies
        if: steps.current.outputs.current == 'true'
        run: |
          pnpm install --frozen-lockfile
          npm ci --prefix platform/runtime
          pnpm -C platform/feed install --frozen-lockfile
      - name: Validate the pinned production manifest and read the live Feed gateway mode
        id: mode
        if: steps.current.outputs.current == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/feed-production-evidence"
          node scripts/feed-platform-production.mjs validate ops/feed-production-manifest.json
          node scripts/feed-production-release.mjs prepare "$RUNNER_TEMP"
          mode="$(node scripts/feed-production-release.mjs web-mode "$RUNNER_TEMP/feed-production-evidence/web-mode-before.json")"
          previous="$(node -pe 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).workerVersionId' "$RUNNER_TEMP/feed-production-evidence/web-mode-before.json")"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          # Render the Web in exactly the live mode: a site release never opens or pauses the Feed.
          node scripts/feed-production-release.mjs web "$RELEASE_SHA" "$mode"
          echo "### Site release keeps the Feed gateway \`$mode\` (runtime untouched)" >> "$GITHUB_STEP_SUMMARY"
      - name: Build the real Web without runtime secrets or local dotenv files
        if: steps.current.outputs.current == 'true'
        timeout-minutes: 15
        run: node scripts/feed-production-release.mjs build
      - name: Apply and verify explicitly approved core D1 migrations
        if: steps.current.outputs.current == 'true'
        run: |
          set -euo pipefail
          release_config="$(node scripts/feed-production-release.mjs schema "$RUNNER_TEMP/approved-feed-production-schema")"
          platform/runtime/node_modules/.bin/wrangler d1 migrations apply ghfind --remote --config "$release_config"
      - name: Populate new build cache before replacing the public Web
        if: steps.current.outputs.current == 'true'
        run: node node_modules/@opennextjs/cloudflare/dist/cli/index.js populateCache remote --config platform/runtime/wrangler.web.production.generated.json --cacheChunkSize 10
      - name: Deploy the Web in the live gateway mode
        id: web
        if: steps.current.outputs.current == 'true'
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          platform/runtime/node_modules/.bin/wrangler deploy --config platform/runtime/wrangler.web.production.generated.json --keep-vars --secrets-file "$RUNNER_TEMP/feed-web-secrets.json" --tag "production-$RELEASE_SHA" 2>&1 | tee "$RUNNER_TEMP/feed-production-evidence/web-site-deploy.log"
          version_id="$(node scripts/feed-production-release.mjs web-version-id "$RUNNER_TEMP/feed-production-evidence/web-site-deploy.log")"
          node scripts/feed-production-release.mjs web-verify "$RELEASE_SHA" "$MODE" "$RUNNER_TEMP/feed-production-evidence/web-site.json" ${version_id:+"$version_id"}
          after="$(node scripts/feed-production-release.mjs web-mode "$RUNNER_TEMP/feed-production-evidence/web-mode-after.json")"
          test "$after" = "$MODE"
      - name: Bounded public production smoke
        if: steps.current.outputs.current == 'true'
        id: smoke
        env:
          SMOKE_BASE_URL: https://ghfind.beiming1201.workers.dev
          SMOKE_EXPECTED_ORIGIN: https://ghfind.com
          SMOKE_CANARY_HANDLE: octocat
          SMOKE_FACET_TYPE: language
          SMOKE_FACET_VALUE: TypeScript
        run: pnpm smoke:deployment
      - name: Roll back the Web if the site release failed
        if: steps.current.outputs.current == 'true' && (always() && steps.web.outputs.attempted == 'true' && steps.smoke.outcome != 'success' && steps.mode.outputs.previous != '')
        timeout-minutes: 6
        env:
          PREVIOUS: ${{ steps.mode.outputs.previous }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s platform/runtime/node_modules/.bin/wrangler rollback "$PREVIOUS" --name ghfind --message "Site release failed; restore the previous Web" --yes
          restored="$(node scripts/feed-production-release.mjs web-mode "$RUNNER_TEMP/feed-production-evidence/web-mode-restored.json")"
          test "$restored" = "$MODE"
      - name: Preserve nonsecret actual evidence, including failures
        if: steps.current.outputs.current == 'true' && (always())
        uses: actions/upload-artifact@v4
        with:
          name: site-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/feed-production-evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: Remove temporary plaintext role credentials
        if: steps.current.outputs.current == 'true' && (always())
        run: rm -f "$RUNNER_TEMP/feed-web-secrets.json" "$RUNNER_TEMP/feed-runtime-secrets.json" "$RUNNER_TEMP/feed-adapter-secrets.json"

  deploy-bot:
    name: Deploy bot after its legacy SCORE backend
    needs: [deploy, site]
    # !cancelled(): one of deploy/site is always skipped. The bot follows its legacy
    # SCORE backend: a site release, a completed cutover, or a cutover that already
    # verified the paused Web at this release before failing.
    if: ${{ !cancelled() && (needs.site.result == 'success' || needs.deploy.result == 'success' || needs.deploy.outputs.web_released == 'true') && github.repository == 'FindAny/ghfind' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'deploy' && github.event.workflow_run.repository.full_name == 'FindAny/ghfind' }}
    environment: Production
    concurrency:
      group: ghfind-bot-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: platform/github-app
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Assemble workspace (ghfind-server + ghfind-frontend)
        uses: ./.github/actions/assemble
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          require-manifest: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Require exact current deploy branch before production writes
        id: current
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          current_main=$(git ls-remote origin refs/heads/deploy | cut -f1)
          if [ "$current_main" != "$RELEASE_SHA" ]; then
            echo "::notice::superseded"
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"
      - name: Apply bot migrations then deploy the matching Worker
        if: steps.current.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 8f19bebe359e4ec1a24c68c5f49c1584
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 migrations apply ghfind-bot --remote --env production
          pnpm exec wrangler deploy --env production --tag "production-$RELEASE_SHA" --message "Bot after verified legacy SCORE backend $RELEASE_SHA"
